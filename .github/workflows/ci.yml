name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test public guards
        run: npm run test:public-guards

      - name: Check public dependency boundary
        run: npm run check:public-boundary

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check public bundle budget
        run: npm run check:public-bundle

      - name: Security audit (runtime deps)
        run: npm run audit:security
