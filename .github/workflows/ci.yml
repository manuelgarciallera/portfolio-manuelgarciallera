name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test public guards
        run: npm run test:public-guards

      - name: Test public behavior and isolation guards
        run: |
          npx vitest run --config vitest.unit.config.ts
          npm run test:owner-isolation

      - name: Check public dependency boundary
        run: npm run check:public-boundary

      - name: Check encoding, hero and responsive structure
        run: |
          npm run check:encoding
          npm run check:hero
          npm run check:responsive

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check public bundle budget
        run: npm run check:public-bundle

      - name: Security audit (runtime deps)
        run: npm run audit:security

  owner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: owner-platform
    env:
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: owner-platform/package-lock.json

      - name: Install owner from lockfile
        run: npm ci

      # Uses a temporary SQLite database; no owner or production secrets.
      - name: Test owner, real SQLite integration, lint, types and build
        run: npm run check

      - name: Security audit (owner runtime deps)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
